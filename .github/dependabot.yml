# Version updates by pull request. Keep `github-actions`, and add one block
# per ecosystem the repository uses (pip, npm, docker, gomod, cargo...).
# Security updates are separate and need no file (apply.py turns them on).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

