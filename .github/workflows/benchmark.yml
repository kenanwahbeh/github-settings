# Performance benchmark tracking.
# PR and manual runs compare/comment only; only pushes to main may publish gh-pages.
# Actions are pinned to full commit SHAs.
name: benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark-check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        run: python -m pip install --disable-pip-version-check pytest pytest-benchmark pyyaml
      - name: Run benchmarks
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        run: pytest --benchmark-only --benchmark-autosave --benchmark-json=.benchmarks/current.json
      - name: Compare and comment (no publication)
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        uses: benchmark-action/github-action-benchmark@49efc295c639840069791d8d1f47a24b5e8c7f34 # v1.6.1
        with:
          tool: 'pytest'
          output-file-path: .benchmarks/current.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '200%'
          fail-on-alert: false
          comment-on-alert: true
      - name: Report benchmark status
        if: ${{ hashFiles('**/*benchmark*.py') == '' }}
        run: 'echo "::notice::Benchmark not applicable: no benchmark tests were found."'

  benchmark-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        run: python -m pip install --disable-pip-version-check pytest pytest-benchmark pyyaml
      - name: Run benchmarks
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        run: pytest --benchmark-only --benchmark-autosave --benchmark-json=.benchmarks/current.json
      - name: Publish main baseline
        if: ${{ hashFiles('**/*benchmark*.py') != '' }}
        uses: benchmark-action/github-action-benchmark@49efc295c639840069791d8d1f47a24b5e8c7f34 # v1.6.1
        with:
          tool: 'pytest'
          output-file-path: .benchmarks/current.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          fail-on-alert: false
          comment-on-alert: false
      - name: Report benchmark status
        if: ${{ hashFiles('**/*benchmark*.py') == '' }}
        run: 'echo "::notice::Benchmark not applicable: no benchmark tests were found."'
