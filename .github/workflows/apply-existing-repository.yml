name: apply-existing-repository

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Existing repository name under this account"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: repository-creation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate target repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          test -n "$GH_TOKEN"
          actual=$(gh api "repos/$OWNER/$REPOSITORY" --jq .full_name)
          [[ "$actual" == "$OWNER/$REPOSITORY" ]]

      - name: Install the pinned test dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r tests/requirements.txt

      - name: Preview repository settings
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
        run: python apply.py "$OWNER/$REPOSITORY" --dry-run

      - name: Apply repository settings
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
        run: python apply.py "$OWNER/$REPOSITORY"
