name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-and-consistency:
    name: Regression and consistency checks
    if: ${{ hashFiles('scripts/**', 'tests/**', '*.py', '*.yml') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install the test dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --require-hashes
          -r tests/requirements.txt

      - name: Compile apply.py
        run: python -m py_compile apply.py

      - name: Run offline regression tests
        run: python tests/test_apply.py

      - name: Check workflow template synchronization
        run: bash scripts/check-workflows-sync.sh

      - name: Check pinned tool versions
        run: bash scripts/check-tool-versions.sh

      - name: Check immutable Action references
        run: python scripts/check-action-pins.py

      - name: Lint workflow files
        env:
          # Update the pinned version and checksum together when upgrading actionlint.
          ACTIONLINT_VERSION: 1.7.12
          # SHA-256 from the upstream release checksums.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check -
          tar xzf "$archive" actionlint
          rm "$archive"
          ./actionlint -color
