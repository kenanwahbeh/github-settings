# Mutation testing with mutmut — verifies test suite quality.
# Runs weekly on main (heavy); optional on PR via workflow_dispatch.
# Actions are pinned to full commit SHAs.
name: mutation-testing
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * 0'   # weekly Sunday 03:15 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install mutmut
        run: python -m pip install --disable-pip-version-check mutmut==2.4.3
      - name: Run mutation testing
        run: |
          mutmut run --paths-to-mutate=. --tests-dir=tests --runner="python -m pytest -x" --timeout-factor=3
      - name: Results summary
        if: always()
        run: mutmut results --show-all