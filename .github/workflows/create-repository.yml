name: create-repository

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "New repository name"
        required: true
        type: string
      description:
        description: "Repository description"
        required: false
        type: string
      visibility:
        description: "Repository visibility"
        required: true
        default: private
        type: choice
        options:
          - private
          - public
      preset:
        description: "Project preset"
        required: true
        default: generic
        type: choice
        options:
          - generic
          - python
          - nextjs
          - cloudflare-worker

permissions:
  contents: read

jobs:
  create:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: repository-creation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate inputs
        env:
          REPOSITORY: ${{ inputs.repository }}
          PRESET: ${{ inputs.preset }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$PRESET" =~ ^(generic|python|nextjs|cloudflare-worker)$ ]]
          [[ "$VISIBILITY" =~ ^(public|private)$ ]]
          if [[ "$PRESET" == cloudflare-worker && "$VISIBILITY" != public ]]; then
            echo "The cloudflare-worker preset is currently available for public repositories only" >&2
            exit 1
          fi
      - name: Create repository from template
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          TEMPLATE: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
          DESCRIPTION: ${{ inputs.description }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          test -n "$GH_TOKEN"
          payload=$(jq -n \
            --arg owner "$OWNER" \
            --arg name "$REPOSITORY" \
            --arg description "$DESCRIPTION" \
            --argjson private "$([[ "$VISIBILITY" == private ]] && echo true || echo false)" \
            '{owner:$owner,name:$name,description:$description,private:$private,include_all_branches:false}')
          gh api "repos/$TEMPLATE/generate" --method POST --input - <<< "$payload"
      - name: Apply repository settings
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          repo="$OWNER/$REPOSITORY"
          python -m pip install --disable-pip-version-check --require-hashes -r tests/requirements.txt
          python apply.py "$repo" --dry-run
          python apply.py "$repo"
      - name: Dispatch bootstrap
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
          PRESET: ${{ inputs.preset }}
        run: |
          for attempt in {1..12}; do
            echo "Dispatch attempt $attempt"
            if gh api "repos/$OWNER/$REPOSITORY/actions/workflows/bootstrap.yml/dispatches" \
              --method POST -f ref=main -f "inputs[preset]=$PRESET"; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not dispatch bootstrap workflow" >&2
          exit 1

      - name: Open bootstrap pull request
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
          PRESET: ${{ inputs.preset }}
        run: |
          for attempt in {1..24}; do
            if gh api "repos/$OWNER/$REPOSITORY/git/ref/heads/bootstrap/$PRESET" >/dev/null 2>&1; then
              gh pr create --repo "$OWNER/$REPOSITORY" \
                --base main --head "bootstrap/$PRESET" \
                --title "chore: initialize $PRESET project" \
                --body "Initial project bootstrap generated from the repository template."
              exit 0
            fi
            sleep 5
          done
          echo "Bootstrap branch was not created in time" >&2
          exit 1
