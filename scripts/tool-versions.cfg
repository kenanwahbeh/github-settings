# Tool versions that live inside shell commands in the workflows — Dependabot
# cannot update them there. scripts/check-tool-versions.sh reads this file and
# fails when a workflow drifts from the pinned value here, so bumping is one
# deliberate edit + one script run instead of hunting two mirrored files.
# Verified against upstream releases on 2026-10-23.
gitleaks: "8.30.1"   # GITLEAKS_VERSION env in secrets.yml (both copies)
semgrep: "1.179.0"   # uvx semgrep== pin in semgrep.yml (both copies)
