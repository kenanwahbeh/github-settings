# Tool versions that live inside shell commands in the workflows — Dependabot
# cannot update them there. scripts/check-tool-versions.sh reads this file and
# fails when a workflow drifts from the pinned value here, so bumping is one
# deliberate edit + one script run instead of hunting two mirrored files.
# Verified against upstream releases on 2026-10-23.
gitleaks: "8.30.1"   # GITLEAKS_VERSION env in secrets.yml (both copies)
gitleaks_sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # Linux x64 archive
semgrep: "1.179.0"   # uvx semgrep== pin in semgrep.yml / semgrep-extended.yml (both copies)
actionlint: "1.7.12"   # ACTIONLINT_VERSION env in tests.yml
actionlint_sha256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"   # Linux amd64 archive
osv_scanner: "1.7.0"   # google/osv-scanner@ pin in deps-sca.yml
mutmut: "2.4.3"   # mutmut== pin in mutation-testing.yml
benchmark_action: "1.6.1"   # benchmark-action/github-action-benchmark@ pin in benchmark.yml
