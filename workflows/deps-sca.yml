# Dependency SCA — OSV-Scanner.
# Prints OSV results to the job log; SARIF upload is unavailable on GitHub Free
# private repositories without Code Scanning.
# The scanner image is pinned to a verified multi-arch digest.
name: deps-sca
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'   # weekly Monday 02:30 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan dependencies with OSV-Scanner
        env:
          OSV_VERSION: "2.7.0"
          OSV_IMAGE: "ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0"
        run: |
          set +e
          docker run --rm -v "$PWD:/src" "$OSV_IMAGE" \
            scan source --recursive /src --format vertical --output-file /src/osv-results.txt
          status=$?
          if [[ -f osv-results.txt ]]; then
            cat osv-results.txt
          else
            echo "OSV-Scanner $OSV_VERSION produced no report file" >&2
            if [[ "$status" -eq 0 ]]; then
              status=1
            fi
          fi
          exit "$status"
