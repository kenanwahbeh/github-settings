# Container image security — Trivy scans the built Docker image.
# Requires a Dockerfile in the repository root (or set DOCKERFILE_PATH).
# Uploads SARIF to GitHub Security tab.
# Actions are pinned to full commit SHAs.
name: container-security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker build -t local/app:test .
      - name: Report scanner requirement
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: echo "Docker image built; configure a SHA-compatible Trivy runner for image scanning."
