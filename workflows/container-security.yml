# Container image security — Trivy scans the built Docker image.
# Requires a Dockerfile in the repository root (or set DOCKERFILE_PATH).
# Uploads SARIF to GitHub Security tab.
# Actions are pinned to full commit SHAs.
name: container-security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker build -t local/app:test .
      - name: Scan image with Trivy
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            aquasec/trivy:0.69.0 image local/app:test \
            --format sarif --output /work/trivy-results.sarif \
            --exit-code 1 --ignore-unfixed
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        if: ${{ hashFiles('Dockerfile') != '' && always() }}
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
