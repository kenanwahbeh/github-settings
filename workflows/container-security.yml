# Container image security — Trivy scans the built Docker image.
# Requires a Dockerfile in the repository root.
# Prints Trivy results to the job log. SARIF upload is unavailable on GitHub
# Free private repositories without Code Scanning.
# Trivy is pinned to a verified linux/amd64 digest.
name: container-security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker build -t local/app:test .
      - name: Scan image with Trivy
        if: ${{ hashFiles('Dockerfile') != '' }}
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_IMAGE: "aquasec/trivy@sha256:2e6c00d711ab4ae41d8a30c2c1fd3bd3b62704c177bb120f95012e939edfb3df"
        run: |
          echo "Trivy $TRIVY_VERSION"
          docker run --rm \
            --platform linux/amd64 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            "$TRIVY_IMAGE" image local/app:test \
            --format table \
            --exit-code 1 --ignore-unfixed
      - name: Report scan status
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: 'echo "::notice::Container scan not applicable: no Dockerfile was found."'
