name: semgrep

# Code scanning on the free rules, in place of CodeQL, which a private
# repository does not get on GitHub Pro. Fails on any finding.
# Pick the rule packs for the repository's languages (semgrep.dev/explore):
# p/python, p/django, p/javascript, p/typescript, p/react, p/nextjs...
# Actions are pinned to full commit SHAs. Dependabot updates the active
# workflows; update the matching templates in the same pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: >-
          uvx semgrep==1.179.0 scan --metrics off --error
          --config p/default --config p/secrets
          .
