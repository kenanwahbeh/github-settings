# Kinan's GitHub settings: applied to any of his repositories on request.
# Apply with: uv run apply.py <owner/repo> [--check <name> ...]
# What has no API is listed under `manual` in README.md.

security:
  dependabot_alerts: true          # also turns on the dependency graph
  dependabot_security_updates: true
  # Tried on every repository. On a private one GitHub may refuse them
  # (paid add-ons); apply.py then says so, and gitleaks covers the secrets.
  secret_scanning: true
  secret_scanning_push_protection: true
  codeql_default_setup: public      # public repos use CodeQL; private repos use Semgrep below
  gitleaks_workflow: private        # workflows/secrets.yml by a pull request: private, all or none
  # Tool versions inside the workflow shell commands (GITLEAKS_VERSION,
  # semgrep==) are outside Dependabot's reach: their source of truth is
  # scripts/tool-versions.cfg, verified by scripts/check-tool-versions.sh.
  semgrep_workflow: private         # workflows/semgrep.yml by a pull request, in place of CodeQL
  private_vulnerability_reporting: public   # public-only feature: public, all or none
  dependabot_version_updates: all   # templates/dependabot.yml by a pull request: all or none
  security_policy: public           # templates/SECURITY.md by a pull request: public, all or none

merge:
  delete_branch_on_merge: true
  allow_auto_merge: true
  # One merge method. Keep this in step with `ruleset.allowed_merge_methods`.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

# GitHub Actions at the repository level.
actions:
  default_workflow_permissions: read          # GITHUB_TOKEN read-only unless a workflow asks for more
  can_approve_pull_request_reviews: false     # workflows cannot approve pull requests
  fork_pr_approval: all_external_contributors # first_time_contributors_new_to_github, first_time_contributors or all_external_contributors
  # Phase 2: apply only after pinned workflows reach the target default branch.
  # apply.py refuses enforcement while mutable references remain there.
  sha_pinning_required: true

# A ruleset on the default branch. Required checks are repository-specific:
# pass EVERY desired check with repeated --check flags after verifying the
# exact check names on a real PR. Supplying --check replaces the complete
# required check names, preserving the live policy and retained source bindings.
# Omitting --check preserves the complete live check rule.
# For this repository, use the command documented in README.md to include
# gitleaks, semgrep, and "Regression and consistency checks".
# Ownership policy: settings.yml owns every rule EXCEPT types listed in
# keep_existing_rules. Omitting --check keeps the live required_status_checks
# rule; passing --check replaces its names while preserving policy and retained
# source bindings. New names have no source binding by default. Other
# code_scanning is retained when this policy does not configure it for the
# target scope. Other manually-added rule types are replaced on the next run.
ruleset:
  name: main
  block_deletion: true
  block_force_push: true
  require_pull_request: true
  # Configurable per repository; zero is not a policy for every customer.
  strict_required_status_checks_policy: true
  required_approvals: 0
  dismiss_stale_reviews_on_push: true
  require_code_owner_review: false
  require_last_push_approval: false
  required_review_thread_resolution: true
  code_scanning:
    scope: public                 # private repositories require a supported tool/plan
    tools:
      - tool: CodeQL
        alerts_threshold: errors
        security_alerts_threshold: high_or_higher
  allowed_merge_methods: [squash]
  require_signed_commits: true
  keep_existing_rules: [required_status_checks, code_scanning]

# A ruleset on release tags: a published version can neither move nor vanish.
# Ownership policy (tag ruleset): fully owned by settings.yml — keep_existing_rules
# is empty on purpose; anything added by hand to this ruleset is replaced on
# the next run (tested: test_tag_ruleset_does_not_keep_manual_rules).
tag_ruleset:
  name: tags
  pattern: "v*"
  block_deletion: true
  block_update: true
  keep_existing_rules: []

# Repositories that keep direct pushes to the default branch.
ruleset_exclude:
  - kenanwahbeh/kenanwahbeh
  - kenanwahbeh/kenanwahbeh.github.io
